appId: com.maskbuild.nkw-custom-skin
productName: NKW Custom Skin
copyright: Maskbuild
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# the mod templates are read from disk by Gradle, so they live next to the app, not inside the archive
extraResources:
  - from: ../mod-templates
    to: mod-templates
    filter:
      - '**/*'
      - '!**/build/**'
      - '!**/.gradle/**'
      - '!**/run/**'
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: zip
      arch: x64
  signAndEditExecutable: false
  artifactName: NKW-Custom-Skin-${version}-win-x64.zip
